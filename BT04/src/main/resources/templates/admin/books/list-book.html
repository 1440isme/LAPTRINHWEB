<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{admin/layout-admin}">

<head>
	<meta charset="UTF-8">
	<title>Danh sách sách</title>
	<!-- Bootstrap 5 & Font Awesome -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
	<style>
		body {
			background: #f8fafc;
		}

		.card {
			border-radius: 16px;
			box-shadow: 0 2px 16px rgba(0, 0, 0, 0.07);
		}

		.table th {
			border: none;
			font-weight: 600;
			color: #495057;
			background: #f8f9fa;
		}

		.btn {
			border-radius: 8px;
		}

		.book-image {
			width: 60px;
			height: 80px;
			object-fit: cover;
			border-radius: 8px;
		}

		.book-title {
			font-weight: 500;
			color: #2d3748;
		}

		.book-publisher {
			font-size: 0.875rem;
			color: #718096;
		}

		.book-price {
			font-weight: 600;
			color: #e53e3e;
		}
	</style>
</head>

<body>
	<div layout:fragment="content">

		<div class="container py-5">
			<div class="card p-4">
				<div class="d-flex justify-content-between align-items-center mb-4">
					<h4>
						<i class="fa fa-book me-2"></i>Danh sách sách
					</h4>

					<div>
						<a th:href="@{/admin/book/search}" class="btn btn-primary me-2"> <i
								class="fas fa-search me-1"></i>Tìm
							kiếm
						</a> <a th:href="@{/admin/book/add}" class="btn btn-primary"> <i
								class="fa fa-plus me-1"></i>Thêm
							mới
						</a>
					</div>
				</div>

				<!-- Hiển thị thông báo thành công/lỗi -->
				<div th:if="${message != null}" class="alert alert-success alert-dismissible fade show" role="alert">
					<i class="fa fa-check-circle me-2"></i><span th:text="${message}"></span>
					<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
				</div>
				<div th:if="${error != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
					<i class="fa fa-exclamation-triangle me-2"></i><span th:text="${error}"></span>
					<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
				</div>

				<div class="table-responsive">
					<table class="table table-hover">
						<thead>
							<tr>
								<th>ID</th>
								<th>Hình bìa</th>
								<th>Thông tin sách</th>
								<th>ISBN</th>
								<th>Giá</th>
								<th>Số lượng</th>
								<th>Ngày xuất bản</th>
								<th>Thao tác</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="book : ${bookList}">
								<td class="align-middle" th:text="${book.bookId}"></td>
								<td class="align-middle">
									<img th:if="${book.coverImage != null}" th:src="@{/image(fname=${book.coverImage})}"
										alt="Book cover" class="book-image">
									<div th:if="${book.coverImage == null}"
										class="book-image d-flex align-items-center justify-content-center bg-light text-muted">
										<i class="fa fa-book"></i>
									</div>
								</td>
								<td class="align-middle">
									<div class="book-title" th:text="${book.title}"></div>
									<div class="book-publisher" th:if="${book.publisher != null}">
										<i class="fa fa-building me-1"></i><span th:text="${book.publisher}"></span>
									</div>
								</td>
								<td class="align-middle" th:text="${book.isbn}"></td>
								<td class="align-middle">
									<span class="book-price" th:if="${book.price != null}"
										th:text="${book.price + 'đ'}"></span>
								</td>
								<td class="align-middle">
									<span class="badge"
										th:classappend="${book.quantity > 0} ? ' bg-success' : ' bg-danger'"
										th:text="${book.quantity}"></span>
								</td>
								<td class="align-middle" th:text="${book.publishDate}"></td>
								<td class="align-middle">
									<a th:href="@{/admin/book/edit(bookId=${book.bookId})}"
										class="btn btn-sm btn-outline-warning me-2">
										<i class="fa fa-edit"></i> Sửa
									</a>
									<form th:action="@{/admin/book/delete}" method="post" style="display:inline"
										onsubmit="return confirm('Bạn có chắc chắn muốn xóa sách này?')">
										<input type="hidden" name="bookId" th:value="${book.bookId}" />
										<button type="submit" class="btn btn-sm btn-outline-danger">
											<i class="fa fa-trash"></i> Xóa
										</button>
									</form>
								</td>
							</tr>
							<tr th:if="${bookList == null or #lists.isEmpty(bookList)}">
								<td colspan="8" class="text-center text-muted py-4">
									<i class="fa fa-inbox fa-3x mb-3 d-block"></i>
									Chưa có sách nào
								</td>
							</tr>
						</tbody>
					</table>
				</div>

				<!-- Phân trang -->
				<div th:if="${totalPages != null and totalPages > 1}">
					<nav aria-label="Phân trang sách">
						<ul class="pagination justify-content-center">
							<li class="page-item" th:if="${currentPage > 1}">
								<a class="page-link" th:href="@{|?page=${currentPage - 1}|}">
									<i class="fa fa-chevron-left"></i>
								</a>
							</li>

							<li th:each="pageNum : ${#numbers.sequence(1, totalPages)}" class="page-item"
								th:classappend="${pageNum == currentPage} ? ' active'">
								<a class="page-link" th:href="@{|?page=${pageNum}|}" th:text="${pageNum}"></a>
							</li>

							<li class="page-item" th:if="${currentPage < totalPages}">
								<a class="page-link" th:href="@{|?page=${currentPage + 1}|}">
									<i class="fa fa-chevron-right"></i>
								</a>
							</li>
						</ul>
					</nav>
				</div>
			</div>
		</div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
