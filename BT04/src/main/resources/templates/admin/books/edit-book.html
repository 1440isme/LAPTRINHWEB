<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{admin/layout-admin}">

<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa sách</title>
    <!-- Bootstrap 5 & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            background: #f8fafc;
        }

        .card {
            border-radius: 16px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.07);
        }

        .form-label {
            font-weight: 500;
        }

        .btn {
            border-radius: 8px;
        }

        .form-control,
        .form-select {
            border-radius: 8px;
        }

        .current-image {
            max-width: 200px;
            max-height: 250px;
            border-radius: 8px;
            border: 2px solid #e9ecef;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <div layout:fragment="content">

        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card p-4">
                        <h4 class="mb-4 text-center"><i class="fa fa-edit me-2"></i>Chỉnh sửa sách</h4>

                        <!-- Hiển thị thông báo lỗi nếu có -->
                        <div th:if="${error != null}" class="alert alert-danger" role="alert">
                            <i class="fa fa-exclamation-triangle me-2"></i><span th:text="${error}"></span>
                        </div>

                        <form th:action="@{/admin/book/update}" method="post" enctype="multipart/form-data">
                            <input type="hidden" name="bookId" th:value="${book.bookId}">

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="title" class="form-label">Tiêu đề sách <span
                                                class="text-danger">*</span></label>
                                        <input type="text" id="title" name="title" class="form-control"
                                            th:value="${book.title}" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="isbn" class="form-label">ISBN</label>
                                        <input type="number" id="isbn" name="isbn" class="form-control"
                                            th:value="${book.isbn}">
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="publisher" class="form-label">Nhà xuất bản</label>
                                        <input type="text" id="publisher" name="publisher" class="form-control"
                                            th:value="${book.publisher}">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="publishDate" class="form-label">Ngày xuất bản</label>
                                        <input type="date" id="publishDate" name="publishDate" class="form-control"
                                            th:value="${book.publishDate}">
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="price" class="form-label">Giá (VNĐ)</label>
                                        <input type="number" step="0.01" id="price" name="price" class="form-control"
                                            th:value="${book.price}">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="quantity" class="form-label">Số lượng</label>
                                        <input type="number" id="quantity" name="quantity" class="form-control" min="0"
                                            th:value="${book.quantity}">
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label">Mô tả</label>
                                <textarea id="description" name="description" class="form-control" rows="4"
                                    th:text="${book.description}"></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="authorIds" class="form-label">Chọn tác giả</label>
                                <select multiple id="authorIds" name="authorIds" class="form-select" size="5">
                                    <option th:each="author : ${authors}" th:value="${author.authorId}"
                                        th:selected="${#lists.contains(book.authors, author)}"
                                        th:text="${author.authorName}"></option>
                                </select>
                                <div class="form-text">Giữ Ctrl để chọn nhiều tác giả</div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Hình bìa hiện tại</label>
                                <div class="mb-2">
                                    <img th:if="${book.coverImage != null}" th:src="@{/image(fname=${book.coverImage})}"
                                        alt="Current cover" class="current-image">
                                    <div th:if="${book.coverImage == null}"
                                        class="current-image d-flex align-items-center justify-content-center bg-light text-muted">
                                        <i class="fa fa-book fa-3x"></i>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="image" class="form-label">Chọn hình bìa mới (để trống nếu không thay
                                    đổi)</label>
                                <input type="file" id="image" name="image" class="form-control" accept="image/*">
                                <div class="form-text">Chọn file hình ảnh mới cho bìa sách (JPG, PNG, GIF)</div>
                            </div>

                            <div class="d-flex justify-content-between">
                                <button type="submit" class="btn btn-warning px-4">
                                    <i class="fa fa-save me-1"></i>Cập nhật
                                </button>
                                <a th:href="@{/admin/books}" class="btn btn-outline-secondary px-4">
                                    <i class="fa fa-arrow-left me-1"></i>Quay lại
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
