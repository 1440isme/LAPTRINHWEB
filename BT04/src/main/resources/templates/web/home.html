<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{web/layout-web}">

<head>
    <title>Trang home của user</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        .book-item {
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 20px;
            padding: 15px;
        }

        .book-cover {
            max-width: 150px;
        }
    </style>
</head>

<body>

    <div layout:fragment="content">

        <div class="container my-5">
            <h2 class="text-center mb-4">Danh sách sách</h2>

            <div th:if="${bookList != null and !#lists.isEmpty(bookList)}">
                <div th:each="book : ${bookList}">
                    <div class="row book-item">
                        <!-- Ảnh bìa -->
                        <div class="col-md-3 text-center">
                            <img th:if="${book.coverImage != null}" th:src="@{/image(fname=${book.coverImage})}"
                                th:alt="${book.title}" class="img-fluid book-cover">
                            <div th:if="${book.coverImage == null}"
                                class="book-cover bg-light d-flex align-items-center justify-content-center"
                                style="height: 200px;">
                                <i class="fas fa-book fa-3x text-muted"></i>
                            </div>
                        </div>
                        <!-- Thông tin sách -->
                        <div class="col-md-9">
                            <p><strong>Tiêu đề:</strong>
                                <a th:href="@{/book(bookId=${book.bookId})}"
                                    class="text-decoration-none text-primary fs-5 fw-bold" th:text="${book.title}"></a>
                            </p>
                            <p><strong>Mã isbn:</strong> <span th:text="${book.isbn}"></span></p>
                            <p><strong>Tác giả:</strong>
                                <span th:if="${book.authors != null and !#lists.isEmpty(book.authors)}">
                                    <span th:each="author, status : ${book.authors}">
                                        <span th:text="${author.authorName}"></span><span th:if="${!status.last}">,
                                        </span>
                                    </span>
                                </span>
                                <em th:if="${book.authors == null or #lists.isEmpty(book.authors)}">Chưa có thông tin
                                    tác giả</em>
                            </p>
                            <p><strong>Nhà xuất bản:</strong> <span th:text="${book.publisher}"></span></p>
                            <p><strong>Ngày xuất bản:</strong> <span th:text="${book.publishDate}"></span></p>
                            <p><strong>Số lượng:</strong> <span th:text="${book.quantity}"></span></p>
                            <p><strong>Giá:</strong> <span th:text="${book.price}"></span> VND</p>
                            <p><strong>Đánh giá:</strong> <span class="text-primary">(<span
                                        th:text="${book.ratingCount}"></span> đánh giá)</span></p>
                        </div>
                    </div>
                </div>
            </div>
            <div th:if="${bookList == null or #lists.isEmpty(bookList)}" class="text-center">
                <div class="alert alert-info">
                    <i class="fas fa-info-circle me-2"></i>
                    Hiện tại chưa có sách nào trong hệ thống hoặc không thể kết nối đến cơ sở dữ liệu.
                    <br>
                    <small class="text-muted">Vui lòng kiểm tra kết nối cơ sở dữ liệu hoặc thêm dữ liệu mẫu.</small>
                </div>
            </div>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
