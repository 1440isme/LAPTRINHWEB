<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity=""
        crossorigin="anonymous">
    <style>
        /* Shared glassmorphism styles to ensure header/footer gradients always apply */
        .navbar.glassmorphism {
            background: linear-gradient(135deg, rgba(20, 28, 60, 0.9), rgba(10, 18, 40, 0.9)) !important;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.18);
        }

        .footer-glassmorphism {
            background: linear-gradient(135deg, rgba(0, 20, 36, 0.9), rgba(9, 32, 63, 0.9)) !important;
            backdrop-filter: blur(10px);
            box-shadow: 0 -8px 32px rgba(31, 38, 135, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.18);
        }
    </style>
    <title>Admin</title>
</head>

<body>
    <header class="row">
        <div class="col">
            <div th:replace="~{admin/fragments/header :: header}"></div>
        </div>
    </header>

    <main class="container">
        <section class="row mt-4">
            <div class="col mt-5 mb-5">
                <div layout:fragment="content"></div>
            </div>
        </section>
    </main>
    <footer class="row">
        <div class="col">
            <div th:replace="~{admin/fragments/footer :: footer}"></div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>



</html>
