<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{web/layout-web}">

<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div layout:fragment="content">

        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header text-center">
                            <h3>Đăng nhập</h3>
                        </div>
                        <div class="card-body">
                            <!-- Display success message -->
                            <div th:if="${success != null}" class="alert alert-success" th:text="${success}"></div>

                            <!-- Display error message -->
                            <div th:if="${alert != null}" class="alert alert-danger" th:text="${alert}"></div>

                            <form th:action="@{/login}" method="post">
                                <div class="mb-3">
                                    <label for="email" class="form-label">Tên đăng nhập (Email):</label>
                                    <input type="text" class="form-control" id="email" name="email" required>
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label">Mật khẩu:</label>
                                    <input type="password" class="form-control" id="password" name="password" required>
                                </div>

                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary">Đăng nhập</button>
                                </div>
                            </form>

                            <div class="text-center mt-3">
                                <p>Chưa có tài khoản? <a th:href="@{/register}">Đăng ký ngay</a></p>
                                <p><a th:href="@{/forgot-password}">Quên mật khẩu?</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
